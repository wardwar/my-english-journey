# Memeriksa semua link sumber belajar tiap minggu & setiap kali data berubah.
# Jika ada link mati, job gagal (tanda ❌ di tab Actions) supaya bisa segera diganti.
name: Check resource links
on:
  push:
    paths: ["assets/js/data/**", "README.md", ".github/workflows/links.yml"]
  schedule:
    - cron: "17 2 * * 1"   # setiap Senin 02:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403/429/503: banyak situs (Gutenberg, universitas) memblokir bot tapi halamannya ada.
          # Link yang benar-benar mati (404/410/DNS error) tetap membuat job gagal.
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
            --accept "200..=299,403,429,503"
            --exclude "^https://github.com/wardwar/my-english-journey"
            assets/js/data/resources.js README.md
          fail: true
